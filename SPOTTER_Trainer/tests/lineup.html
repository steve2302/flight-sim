<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Species lineup</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
  #wrap { position: relative; width: 100vw; aspect-ratio: 16 / 9; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #bar { padding: 6px 10px; }
</style>
</head>
<body>
<!-- Dev page: a fixed scene with each species in each bin, for judging the view.
     URL params: ?habitat=plains|saltbush|woodland&sun=farSide|observerSide|ahead|behind&t=12&boost=1&seat=Front -->
<div id="wrap"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<div id="bar"></div>
<script src="../vendor/three.min.js"></script>
<script src="../js/core.js"></script>
<script src="../js/scenario.js"></script>
<script src="../js/overlay.js"></script>
<script src="../js/world.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const habitat = q.get('habitat') || 'plains', sun = q.get('sun') || 'farSide';
  const t = +(q.get('t') || 14), boost = +(q.get('boost') || 1);
  const sc = ST.generateScenario({ seed: 'lineup', durationS: 120, habitat, sun, distractors: false });
  // Replace groups with a lineup: at the along-track position abeam at time t,
  // spaced along-track by species, one row per bin centre.
  const v = ST.CFG.speedMs, s0 = v * t;
  const species = [['red_kangaroo', 'sit'], ['red_kangaroo', 'graze'], ['grey_kangaroo', 'sit'], ['grey_kangaroo', 'graze'], ['goat', 'graze']];
  const Xs = [65, 115, 190, 290];
  const rng = ST.rng('lineup-members');
  sc.groups = [];
  Xs.forEach((X, bi) => species.forEach(([sp, beh], k) => {
    const n = 3;
    const members = [];
    for (let i = 0; i < n; i++) {
      members.push({ ds: i * 2.2 - 2.2, dx: (i % 2) * 1.5, scale: i === 2 ? 0.7 : 1,
        pose: sp === 'goat' ? 'stand' : beh === 'graze' ? (i ? 'graze' : 'sit') : 'sit',
        morph: sp === 'goat' ? ['white', 'brown', 'patchy'][i] : sp === 'red_kangaroo' ? (i === 0 ? 'male' : 'female') : 'grey',
        yaw: rng() * 6.28, phase: rng() * 10 });
    }
    const g = { id: `${bi}${k}`, side: 'R', species: sp, size: n, X, s: s0 + (k - 2) * (18 + X * 0.18),
      bin: ST.geom.binOf(X).key, binIdx: bi, behaviour: beh, members };
    Object.assign(g, { tEnter: 0, tAbeam: g.s / v, tExit: 1e9 });
    sc.groups.push(g);
  }));
  const world = new ST.World(document.getElementById('gl'), sc, { side: 'R', quality: 'high', sizeBoost: boost });
  const ov = new ST.Overlay(document.getElementById('ov'), { side: 'R', seat: q.get('seat') || 'Front', guides: true, labels: true, glare: sun === 'observerSide' });
  const W = +(q.get('w') || 1920); world.resize(W, W * 9 / 16); ov.resize(W, W * 9 / 16);
  world.prewarm();
  // Animate briefly so idle motion runs, then hold the frame at time t
  let tt = t - 0.5;
  function frame() {
    world.update(tt); world.render(); ov.draw(world, tt);
    if (tt < t) { tt += 1 / 60; requestAnimationFrame(frame); }
    else document.title = 'ready';
  }
  frame();
  document.getElementById('bar').textContent =
    `Columns left→right: red (sit), red (graze), grey (sit), grey (graze), goat. Rows: bin centres 25, 75, 150, 250 m. habitat=${habitat} sun=${sun} boost=${boost}`;
  window.world = world;
})();
</script>
</body>
</html>
